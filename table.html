<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Data Table</title>
  <style>
    body {

      a.button {
        display: inline-block;
        margin-top: 20px;
        margin-left: 20 px;
        margin-right: 20px;
        padding: 10px 20px;
        background-color: #0077cc;
        color: white;
        text-decoration: none;
        border-radius: 5px;
      }

      a.button:hover {
      background-color: #005fa3;
      }
      
      font-family: Arial, sans-serif;
      padding: 40px;
      background-color: #f8f8f8;
      text-align: center;
    }

    h1 {
      margin-bottom: 30px;
    }

    table {
      margin: 0 auto;
      width: 95%;
      border-collapse: collapse;
      font-size: 16px;
    }

    th, td {
      padding: 12px;
      border: 1px solid #ccc;
      text-align: left;
    }

    thead {
      background-color: #eaeaea;
    }
  </style>
</head>
<body>

  <nav style="text-align: right; "margin-bottom: 50px;">
    <a href="index.html" class="button">Home</a>
    <a href="table.html" class="button">Data Table</a>
    <a href="stats.html" class="button">Stats</a>
    <a href="stories.html" class="button">Stories</a>
    <a href="log.html" class="button">Log</a>
    <a href="about.html" class="button">About</a>
  </nav>

  <h1>Soldier Status Table</h1>
  <div id="table-container">Loading data...</div>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <script>
    Papa.parse('Table.csv', {
      download: true,
      header: true,
      worker: true,        // parse in background
      chunkSize: 1000,     // number of rows per chunk
      chunk: function(results) {
          appendRows(results.data);
      },
      complete: function() {
          console.log('CSV fully loaded');
      },
      error: function(err) {
          console.error("CSV Load Error:", err);
          document.getElementById('table-container').innerText = 'Failed to load CSV data.';
      }
    });

   function appendRows(rows) {
      const container = document.getElementById('table-container');

      // Create table if it doesn't exist
      if (!container.querySelector('table')) {
          container.innerHTML = '<table><thead><tr><th>#</th></tr></thead><tbody></tbody></table>';
      }

      const tbody = container.querySelector('tbody');

      rows.forEach(row => {
          if (!Object.values(row).some(cell => cell.trim() !== "")) return;

          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${tbody.children.length + 1}</td>` +
                         Object.values(row).map(cell => `<td>${cell}</td>`).join('');
          tbody.appendChild(tr);
      });
   }
  </script>

</body>
</html>
